<!DOCTYPE html>
<html lang="lv">
    <head>
        <meta charset="utf-8">
        <title>Jauns uzdevums – ToDo</title>
        <link rel="stylesheet" href="assets/css/style.css">
    </head>

    <body data-page="task-new">
        <header class="nav">
            <div class="nav-in">
                <a class="logo-box" href="dashboard.html">
                    <img src="assets/img/logo.png" alt="ToDo">
                </a>
                <nav class="links" id="nav">
                    <a href="dashboard.html">Pārskats</a>
                    <a href="tasks.html">Mani uzdevumi</a>
                    <a href="projects.html">Projekti</a>
                    <a href="invitations.html">Uzaicinājumi</a>
                    <a href="login.html">Izrakstīties</a>
                </nav>
            </div>
        </header>

        <main class="wrap">
            <div class="crumb">Darba telpa / Planner</div>
            <h1>Jauns uzdevums</h1>
            <p class="sub">Pievieno nosaukumu, termiņu un prioritāti.</p>
            <form id="form" novalidate>
                <div class="card field">
                    <label for="title">Nosaukums</label>
                    <input id="title" name="title" type="text" placeholder="Piemēram, Sagatavot atskaiti" data-req>
                </div>
                <div class="card field">
                    <label for="desc">Apraksts</label>
                    <input id="desc" name="desc" type="text" placeholder="Īss apraksts">
                </div>
                <div class="card field">
                    <label for="due">Termiņš</label>
                    <input id="due" name="due" type="date" data-req>
                </div>
                <div class="card field">
                    <label for="pri">Prioritāte</label>
                    <select id="pri" name="pri">
                        <option>Low</option>
                        <option selected>Medium</option>
                        <option>High</option>
                    </select>
                </div>
                <div class="card field" id="assignBox" hidden>
                    <label for="assignee">Piešķirts dalībniekam</label>
                    <select id="assignee" name="assignee"></select>
                </div>
                <button class="btn" type="submit">Izveidot uzdevumu</button>
            </form>
        </main>

        <script src="assets/js/app.js"></script>
    </body>
</html>
