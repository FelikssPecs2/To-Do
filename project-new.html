<!DOCTYPE html>
<html lang="lv">
    <head>
        <meta charset="utf-8">
        <title>Jauns projekts – ToDo</title>
        <link rel="stylesheet" href="assets/css/style.css">
    </head>

    <body data-page="project-new">
        <header class="nav">
            <div class="nav-in">
                <a class="logo-box" href="dashboard.html">
                    <img src="assets/img/logo.png" alt="ToDo">
                </a>
                <nav class="links" id="nav">
                    <a href="dashboard.html">Pārskats</a>
                    <a href="tasks.html">Mani uzdevumi</a>
                    <a href="projects.html">Projekti</a>
                    <a href="invitations.html">Uzaicinājumi</a>
                    <a href="login.html">Izrakstīties</a>
                </nav>
            </div>
        </header>

        <main class="wrap">
            <div class="crumb">Darba telpa / Planner</div>
            <h1>Jauns projekts</h1>
            <p class="sub">Izveido kopīgu darba telpu savai komandai.</p>
            <form id="form" novalidate>
                <div class="card field">
                    <label for="name">Projekta nosaukums</label>
                    <input id="name" name="name" type="text" placeholder="Piemēram, Mājaslapas izstrāde" data-req>
                </div>
                <div class="card field">
                    <label for="desc">Apraksts</label>
                    <input id="desc" name="desc" type="text" placeholder="Apraksti projekta mērķi un sagaidāmo rezultātu.">
                </div>
                <div class="card field">
                    <label for="email">Dalībnieka e-pasts</label>
                    <input id="email" name="email" type="email" placeholder="kolegis@epasts.lv">
                    <div class="hint">Īpašnieks var uzaicināt reģistrētus lietotājus</div>
                </div>
                <div class="card field">
                    <label for="role">Loma projektā</label>
                    <select id="role" name="role">
                        <option value="member">Dalībnieks</option>
                        <option value="admin">Administrators</option>
                    </select>
                    <div class="hint">Administrators var uzaicināt cilvēkus, veidot un dzēst uzdevumus</div>
                </div>
                <button class="btn" type="submit">Izveidot projektu</button>
            </form>
        </main>

        <script src="assets/js/app.js"></script>
    </body>
</html>
