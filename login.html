<!DOCTYPE html>
<html lang="lv">
    <head>
        <meta charset="utf-8">
        <title>Pieslēgšanās – ToDo</title>
        <link rel="stylesheet" href="assets/css/style.css">
    </head>

    <body data-page="login">
        <main class="auth">
            <form id="form" class="auth-card" novalidate>
                <img class="lg" src="assets/img/logo.png" alt="ToDo">
                <h1>Prieks tevi atkal redzēt</h1>
                <p>Pieslēdzies, lai turpinātu savu dienu.</p>
                <label class="a-lbl" for="email">E-posts</label>
                <input class="a-in" id="email" name="email" type="email" placeholder="vards@epasts.lv" data-req>
                <label class="a-lbl" for="pw">Parole</label>
                <input class="a-in" id="pw" name="pw" type="password" placeholder="Parole" data-req>
                <button class="btn" type="submit">Pieslēgties — demo</button>
                <a class="alt" href="register.html">Nav konta? Reģistrējies</a>
                <p class="note">Dizaina demonstrācija. Dati netiek saglabāti.</p>
            </form>
        </main>

        <script src="assets/js/app.js"></script>
    </body>
</html>
